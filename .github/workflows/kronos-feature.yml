name: Kronos feature verification
on:
  push:
    branches: [feature/kronos-live-panel]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kronos-feature-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive exact source for reproducible verification
        run: git archive --format=tar HEAD -o /tmp/kronos-feature-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: kronos-feature-source
          path: /tmp/kronos-feature-source.tar
          retention-days: 1
